name: Build & Test

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VS_VERSION: "1.22.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Every version needs a CHANGELOG.md section: it becomes the release notes, and the Mod DB changelog
      - name: Check the changelog
        run: |
          version=$(python3 -c "import json;print(json.load(open('modinfo.json'))['version'])")
          python3 .github/scripts/changelog.py "$version" > /dev/null || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

      - name: Cache Vintage Story server
        uses: actions/cache@v4
        with:
          path: vs
          key: vs-server-${{ env.VS_VERSION }}

      - name: Download Vintage Story server
        run: bash .github/scripts/get-server.sh

      - name: Detect .NET version used by the game
        id: net
        run: |
          fw=$(python3 -c "import json;d=json.load(open('vs/VintagestoryServer.runtimeconfig.json'));o=d['runtimeOptions'];f=o.get('framework') or o['frameworks'][0];print(f['version'])")
          major=${fw%%.*}
          echo "Game runs on .NET $fw"
          echo "sdk=${major}.0.x" >> "$GITHUB_OUTPUT"
          echo "tfm=net${major}.0" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.net.outputs.sdk }}

      - name: Probe game assets
        continue-on-error: true
        run: bash .github/scripts/probe.sh

      - name: Build mod
        id: build
        continue-on-error: true
        run: bash .github/scripts/build.sh "${{ steps.net.outputs.tfm }}"

      - name: Server smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/smoke.sh

      - name: Upload mod zip
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: EmbalmedEats-mod
          path: out/*.zip
          if-no-files-found: ignore

      - name: Publish GitHub release (when build and server test pass)
        if: steps.build.outcome == 'success' && steps.smoke.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('modinfo.json'))['version'])")
          zip=$(ls out/*.zip | head -1)
          notes=$(mktemp)
          python3 .github/scripts/changelog.py "$version" > "$notes"
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$zip" --clobber
            gh release edit "v$version" --notes-file "$notes"
          else
            gh release create "v$version" "$zip" --title "Embalmed Eats v$version" --notes-file "$notes" --target "$GITHUB_SHA"
          fi
          # Keep earlier releases' notes in step with CHANGELOG.md
          for v in $(python3 .github/scripts/changelog.py --versions); do
            [ "$v" = "$version" ] && continue
            gh release view "v$v" > /dev/null 2>&1 || continue
            python3 .github/scripts/changelog.py "$v" > "$notes" && gh release edit "v$v" --notes-file "$notes" && echo "Updated notes for v$v"
          done
          # What the releases say now, for checking from the ci-results branch
          mkdir -p ci
          for v in $(python3 .github/scripts/changelog.py --versions); do
            echo "== v$v"; gh release view "v$v" --json body -q .body 2>&1 || true
          done > ci/release-notes.txt

      - name: Publish results to ci-results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-results.sh "${{ steps.build.outcome }}" "${{ steps.smoke.outcome }}"

      - name: Fail job if build or smoke test failed
        if: steps.build.outcome != 'success' || (steps.smoke.outcome != 'success' && steps.smoke.outcome != 'skipped')
        run: exit 1
